teaching:
  intro: I pass on what I practise, to ENSAI students as well as to colleagues in the IT department.
  sections:
    - title: ENSAI
      items:
        - period: 2023 and 2026
          text: "Tutorial instructor in computer science and project tutor for second-year students. In 2026, 40 hours of teaching, including supervision of the « Anonymia » IT project: a tool to anonymise administrative documents built on the SSP Cloud AI platform, the official statistics service's data science offer."
        - period: 2025
          text: Member of the IT projects jury.
    - title: Juries and examinations
      items:
        - period: 2026
          text: Member of the jury of the Ministry of Economy and Finance's programmer professional examination, with colleagues from other directorates, after jury training provided by IGPDE. Author of the initial proposal for the written admission test, which the whole jury then enriched and amended.
    - title: Internal training
      items:
        - period: Since 2022
          text: Rebuilt and delivered the Git course for developers, including remotely for production teams, and the web basics course until 2024. The material is published on this site (in French).
  talks_intro: "I take part every year since 2024 in the IT department's internal development seminar at Insee. My public talks:"
  talks:
    - period: 2024
      place: Agile Secteur Public
      text: "« Don't shoot the agile coach! », a case-study talk in theatrical form that recalls the basics of Scrum through short sketches, co-hosted with an Insee agile coach. Given on 18 October 2024, 1:30 pm to 3:20 pm, in the Solférino room, after a first version at the internal seminar."
      url: https://agilesecteurpublic.wixsite.com/agile-secteur-public/programme-2024
      link: Conference programme (in French)
    - period: November 2023
      place: YouTube
      text: Testimonial on my path from controller to attaché, in a video promoting the controller competition on Insee's channel.
      url: https://youtu.be/_CWR9EI-Pqs
      link: Watch the video (in French)

projects_intro: "Personal and open-source work. My work at Insee, which belongs to the State, is described in my career page."

