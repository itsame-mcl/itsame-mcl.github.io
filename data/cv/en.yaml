    org: Insee, Nouvelle-Aquitaine regional directorate
    place: Poitiers
    period: 2018 to 2020
    summary: "Managed household surveys (Labour Force Survey, consumer confidence survey, Trajectories and Origins 2). Managerial referent for a network of four interviewers: annual reviews, coaching, R and Python quality-monitoring tools."
  - role: Founder and manager of Castelambre
    org: Audiovisual production and digital communication company
    place: Poitiers
    period: 2015 to 2017
    summary: Websites, video production, crowdfunding advice, legal, tax and accounting management.
  - role: Statistical analyst then contract PhD researcher
    org: University of Poitiers
    place: Poitiers
    period: 2010, 2011 to 2014
    summary: Analysis of a CROUS Orléans satisfaction survey in 2010, then, from 2011 to 2014, econometric research on the effects of the 2008 crisis in developing countries and tutorials in microeconomics and econometrics (thesis not defended).

