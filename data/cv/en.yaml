person:
  display: Maxence (Collard) Lagalle
  title: Deputy Chief Information Security Officer, accreditation
  headline: Statistician-administrator
  org: Insee
  tagline: As deputy to the Chief Information Security Officer (CISO), I am in charge of accreditation, with a taste for software development and teaching.
  description: Maxence Lagalle, statistician-administrator at Insee, deputy CISO in charge of security accreditation. Former project manager of the insee.fr overhaul, trainer and lecturer.
  portrait_alt: Portrait of Maxence Lagalle
  greeting: Hello, I'm
  values: I like getting involved in projects that serve the public good.
  summary:
    - "I have been an *attaché statisticien* at Insee, the French national statistics institute, since 2020. Since September 2026, I have been in charge of the **accreditation of information systems**: I work with business and IT teams so that every system goes live with its risks understood and its security measures decided."
    - "Before that, I led the IT delivery of the **modular overhaul of insee.fr**, after two years as a developer on the site. My background includes household surveys, econometrics research and running a small company."
    - "I teach computer science at ENSAI, run internal training courses, notably on Git, and share what I learn in seminars and on this site."

highlights:
  - title: Security and accreditation
    text: Leading accreditation processes for information systems, risk analysis following the French national cybersecurity agency (ANSSI) method, preparing accreditation boards.
    link: /en/career/
  - title: insee.fr overhaul
    text: Modular architecture on containers, page-by-page migration through a custom-built router, new Elasticsearch search engine.
    link: /en/career/
  - title: Agility, quality and accessibility
    text: Scrum Master, Heart of Agile, advanced Opquast certification, digital accessibility auditor (RGAA).
    link: /en/career/
  - title: Teaching and sharing
    text: Tutorials and project supervision at ENSAI, exam juries, internal training, seminars, course material published on this site.
    link: /en/teaching/

experience:
  - role: Deputy CISO, accreditation
    org: Insee, Security and Risk Management Division (Information Systems Department)
    place: Montrouge
    start: September 2026
    summary: "I make sure no Insee information system is put into or kept in service unless its risks have been analysed, security measures decided, and the responsible director has formally accepted the remaining risks."
    points:
      - Leading several accreditation processes each year, for applications or infrastructure, with project managers and business owners across directorates.
      - Risk analysis following the ANSSI reference method, bringing together business, development, operations and architecture teams.
      - Checking compliance with the State's security frameworks, preparing accreditation boards, steering audits with external providers and following remediation plans.
      - Handling security incidents and raising staff awareness.
      - "A generative AI assistant specialised in security and accreditation, available to colleagues on the internal AI platform, to help use the ANSSI guides."
  - role: IT project manager, modular overhaul of the insee.fr ecosystem
    org: Insee, SNDIP (Paris IT development service)
    place: Montrouge
    start: September 2024
    end: August 2026
    summary: "Led the IT delivery of the overhaul of insee.fr, the Institute's main publication channel, while the team moved to a product-based way of working."
    points:
      - "Target architecture built from an audit, challenged against the functional vision and approved by Insee's cross-cutting architecture team, including the move to a container infrastructure (Kubernetes)."
      - "Custom-built router letting the old and new sites coexist and migrate page by page: definitions in March 2026, the franc-to-euro converter in April."
      - "New search based on Elasticsearch, demonstrable on most publications when I left, paving the way for natural-language queries and AI assistants."
      - "Agile coordination of developers without hierarchical authority, hands-on development, technical recruitment interviews."
      - "Prototype of the [personalised inflation simulator](https://www.insee.fr/fr/statistiques/2418131) (in French) built with a generative AI agent, then handed to a developer and published on insee.fr in September 2026."
  - role: Analyst-developer
    org: Insee, SNDIP
    place: Montrouge
    start: September 2022
    end: August 2024
    summary: "Maintenance and evolution of insee.fr in a team of five developers (Java, Spring, JavaScript, SQL)."
    points:
      - "Designed the marking of general-public « Première approche » publications: a pictogram and a dedicated filter in the site search."
      - "Team quality referent and member of the service's quality network."
      - "Trainer in Git and web basics for the IT department's developers and production teams: rebuilt the course material and handed it over to other trainers."
      - "Prototype of automatic publication layout, built with the person who prepared the overhaul."
  - role: Trainee statistician-administrator
    org: ENSAI, civil servant programme
    place: Bruz
    start: September 2020
    end: August 2022
    summary: "Elected student representative on the GENES board (2020-2021)."
    points: []

earlier:
