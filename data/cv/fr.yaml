person:
  display: Maxence (Collard) Lagalle
  title: RSSI adjoint, composante homologation
  headline: Attaché statisticien
  org: Insee
  tagline: Adjoint au responsable de la sécurité des systèmes d'information (RSSI), je m'occupe de l'homologation, avec un goût pour le développement et la pédagogie.
  description: Maxence Lagalle, attaché statisticien à l'Insee, RSSI adjoint chargé de l'homologation. Ancien chef de projet de la refonte d'insee.fr, formateur et enseignant.
  portrait_alt: Portrait de Maxence Lagalle
  greeting: Bonjour, je suis
  values: J'aime m'investir sur des projets d'utilité publique.
  summary:
    - "Attaché statisticien de l'Insee depuis 2020, je suis depuis septembre 2026 **RSSI adjoint, composante homologation** : j'accompagne les équipes métier et informatiques pour que chaque système d'information soit mis en service en connaissance des risques et avec des mesures de sécurité décidées."
    - "Auparavant, j'ai piloté la maîtrise d'œuvre informatique de la **refonte modulaire d'insee.fr**, après deux ans comme analyste-développeur sur le site. Je viens des enquêtes auprès des ménages, de la recherche en économétrie et d'une expérience d'entrepreneur."
    - "J'enseigne l'informatique à l'ENSAI, j'anime des formations internes, notamment sur Git, et je partage ce que j'apprends en séminaires et sur ce site."

highlights:
  - title: Sécurité et homologation
    text: Pilotage de démarches d'homologation de systèmes d'information, analyse de risques selon la méthode de l'ANSSI, préparation des commissions d'homologation.
    link: /parcours/
  - title: Refonte d'insee.fr
    text: Architecture modulaire en conteneurs, migration page à page grâce à un aiguillage sur mesure, nouveau moteur de recherche Elasticsearch.
    link: /parcours/
  - title: Agilité, qualité et accessibilité
    text: Scrum Master, Heart of Agile, certification Opquast de niveau avancé, auditeur de l'accessibilité numérique (RGAA).
    link: /parcours/
  - title: Enseignement et transmission
    text: Travaux dirigés et tutorat de projet à l'ENSAI, jurys, formations internes, séminaires, supports de formation publiés sur ce site.
    link: /enseignement/

experience:
  - role: RSSI adjoint, composante homologation
    org: Insee, Division Sécurité et maîtrise des risques (Direction du système d'information)
    place: Montrouge
    start: Septembre 2026
    summary: "Je veille à ce qu'aucun système d'information de l'Insee ne soit mis ou maintenu en service sans que ses risques aient été analysés, que les mesures de sécurité aient été décidées et que son directeur responsable ait formellement accepté les risques restants."
    points:
      - Pilotage de plusieurs démarches d'homologation par an, applications ou infrastructures, en lien avec les chefs de projet et les maîtrises d'ouvrage des directions métier.
      - Analyse de risques selon la méthode de référence de l'ANSSI, avec le métier, les équipes de développement, d'exploitation et d'architecture.
      - Vérification de la conformité aux référentiels de sécurité de l'État, préparation des commissions d'homologation, pilotage des audits avec les prestataires et suivi des plans de remédiation.
      - Traitement des incidents de sécurité et sensibilisation des agents.
      - "Assistant d'IA spécialisé en sécurité et homologation, mis à disposition des collègues sur la plateforme interne d'IA, pour exploiter les guides de l'ANSSI."
  - role: Chef de projet informatique, refonte modulaire de l'écosystème insee.fr
    org: Insee, SNDIP (Service national de développement informatique de Paris)
    place: Montrouge
    start: Septembre 2024
    end: Août 2026
    summary: "Maîtrise d'œuvre informatique de la refonte d'insee.fr, principal canal de diffusion de l'Institut, dans une équipe passée au « mode produit »."
    points:
      - "Architecture cible élaborée à partir d'un audit, confrontée à la vision fonctionnelle puis approuvée par l'équipe transverse d'architecture de l'Insee, avec passage à une infrastructure en conteneurs (Kubernetes)."
      - "Aiguillage développé sur mesure pour faire cohabiter ancien et nouveau site et basculer les pages une à une : définitions en mars 2026, convertisseur franc-euro en avril."
      - "Nouvelle recherche fondée sur Elasticsearch, démontrable sur l'essentiel des publications à mon départ, ouvrant la voie aux requêtes en langage naturel et aux assistants d'IA."
      - "Coordination agile des développeurs sans lien hiérarchique, participation aux développements, entretiens techniques de recrutement."
      - "Prototype du [simulateur d'inflation personnalisé](https://www.insee.fr/fr/statistiques/2418131) développé avec un agent d'IA générative, puis transmis à un développeur et publié sur insee.fr en septembre 2026."
  - role: Analyste-développeur
    org: Insee, SNDIP
    place: Montrouge
    start: Septembre 2022
    end: Août 2024
    summary: "Maintenance et évolutions d'insee.fr au sein d'une équipe de cinq développeurs (Java, Spring, JavaScript, SQL)."
    points:
      - "Conception du repérage des publications « Première approche » destinées au grand public : pictogramme et filtre dédié dans la recherche du site."
      - "Référent qualité de l'équipe et membre du réseau qualité du service."
      - "Formateur Git et bases du web pour les développeurs et les équipes de production de la DSI : refonte des supports et transmission à d'autres formateurs."
      - "Prototype de mise en page automatique des publications, réalisé avec le préfigurateur de la refonte."
  - role: Attaché statisticien stagiaire
    org: ENSAI, cursus fonctionnaire
    place: Bruz
    start: Septembre 2020
    end: Août 2022
    summary: "Élu représentant des élèves au conseil d'administration du GENES (2020-2021)."
    points: []

