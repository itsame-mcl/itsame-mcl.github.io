teaching:
  intro: Je transmets ce que je pratique, auprès d'élèves de l'ENSAI comme de collègues de la DSI.
  sections:
    - title: ENSAI
      items:
        - period: 2023 et 2026
          text: "Chargé de travaux dirigés d'informatique et tuteur de projet des élèves de deuxième année. En 2026, 40 heures d'enseignement, dont le tutorat du projet informatique « Anonymia » : un outil d'anonymisation de documents administratifs reposant sur la plateforme d'IA du SSP Cloud, l'offre de science des données du service statistique public."
        - period: 2025
          text: Membre du jury des projets informatiques.
    - title: Jurys et examens
      items:
        - period: 2026
          text: Membre du jury de l'examen professionnel de programmeur du ministère de l'Économie et des Finances, avec des collègues d'autres directions, après une formation de jury dispensée par l'IGPDE. Auteur de la proposition initiale du sujet de l'épreuve écrite d'admissibilité, enrichie et amendée par l'ensemble du jury.
    - title: Formation interne à la DSI
      items:
        - period: Depuis 2022
          text: Refonte et animation de la formation Git des développeurs, y compris à distance pour les équipes de production, et de la formation aux bases du web jusqu'en 2024. Les supports sont publiés sur ce site.
  talks_intro: "Je participe chaque année depuis 2024 au séminaire interne du développement de la DSI de l'Insee. Mes interventions publiques :"
  talks:
    - period: 2024
      place: Agile Secteur Public
      text: "« Ne tirez pas sur le coach agile ! », retour d'expérience en conférence théâtralisée qui rappelle les bases de Scrum par des saynètes, coanimé avec un coach agile de l'Insee. Présenté le 18 octobre 2024, de 13 h 30 à 15 h 20, salle Solférino, après une première version au séminaire interne."
      url: https://agilesecteurpublic.wixsite.com/agile-secteur-public/programme-2024
      link: Programme de la conférence
    - period: Novembre 2023
      place: YouTube
      text: Témoignage sur mon parcours de contrôleur devenu attaché, dans une vidéo de promotion du concours de contrôleur sur la chaîne de l'Insee.
      url: https://youtu.be/_CWR9EI-Pqs
      link: Voir la vidéo

